  .avatar-fallback { width: 96px; height: 96px; border-radius: 50%; background: ${m.accent}; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; }
  h1 { font-size: 24px; margin-top: 16px; }
  .handle { opacity: .7; font-size: 14px; margin-top: 2px; }
  .bio { font-size: 14px; line-height: 1.7; white-space: pre-wrap; margin-top: 12px; }
  .socials { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .social { background: ${m.surface}; color: ${m.accent}; text-decoration: none; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .heading { font-size: 18px; margin: 24px 0 8px; }
  .text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; margin: 8px 0; }
  .divider { border: none; border-top: 1px solid ${m.accent}55; margin: 20px 0; }
  .button { display: block; background: ${m.surface}; color: ${m.text}; text-decoration: none; border-radius: 16px; padding: 16px 20px; margin: 8px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .button-main { display: block; font-weight: 700; }
  .button-sub { display: block; font-size: 12px; opacity: .7; }
  .bar { display: block; background: ${m.accent}; color: #fff; text-decoration: none; text-align: center; font-weight: 700; padding: 14px; margin: 8px 0; }
  .image-card { display: block; text-decoration: none; color: ${m.text}; margin: 12px 0; }
  .image-card img { width: 100%; border-radius: 16px; }
  .image-label { display: block; font-weight: 700; font-size: 14px; margin-top: 4px; }
  .image-sub { display: block; font-size: 12px; opacity: .7; }
  .goods { display: flex; gap: 16px; background: ${m.surface}; color: ${m.text}; text-decoration: none; border-radius: 16px; padding: 16px; margin: 8px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .goods img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
  .goods-name { display: block; font-weight: 700; }
  .goods-price { display: block; font-weight: 800; color: ${m.accent}; margin-top: 4px; }
  .goods-sub { display: block; font-size: 12px; opacity: .7; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 12px 0; }
  .grid-item { text-decoration: none; color: ${m.text}; text-align: center; }
  .grid-icon { width: 56px; height: 56px; border-radius: 16px; background: ${m.accent}; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
  .grid-label { display: block; font-size: 11px; font-weight: 700; margin-top: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
  .two-item { background: ${m.surface}; color: ${m.text}; text-decoration: none; border-radius: 16px; padding: 16px; font-weight: 700; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .two-sub { display: block; font-size: 12px; font-weight: 400; opacity: .7; margin-top: 4px; }
  .embed { aspect-ratio: 16/9; margin: 12px 0; }
  .embed iframe, .embed-spotify iframe { width: 100%; height: 100%; border: 0; border-radius: 16px; }
  .embed-spotify { margin: 12px 0; }
  .accordion { background: rgba(255,255,255,.7); border-radius: 16px; padding: 16px 20px; margin: 8px 0; }
  .accordion summary { font-weight: 700; cursor: pointer; }
  .accordion p { font-size: 14px; line-height: 1.7; white-space: pre-wrap; margin-top: 12px; }
  .countdown, .form-note { background: rgba(255,255,255,.7); border-radius: 16px; padding: 16px 20px; margin: 12px 0; text-align: center; font-weight: 700; }
  .countdown-num { font-size: 24px; font-weight: 800; color: ${m.accent}; margin-top: 4px; }
  .foot { text-align: center; font-size: 11px; opacity: .5; margin-top: 40px; }
</style>
